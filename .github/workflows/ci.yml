name: CI

on:
  workflow_call:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit
      - name: Scan npm lockfile
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_INCLUDE_DEV_DEPS: 'true'
        with:
          scan-type: fs
          scan-ref: .
          version: v0.76.1
          scanners: vuln
          severity: MEDIUM,HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: false
          skip-dirs: node_modules
      - name: Check npm advisory database
        shell: bash
        run: |
          set +e
          npm run security:audit
          status=$?
          set -e
          if [ "$status" -eq 75 ]; then
            echo "::warning::npm audit is temporarily unavailable after three attempts; the mandatory Trivy lockfile scan passed."
            exit 0
          fi
          exit "$status"

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit
      - run: npm run catalog:check
      - run: npm run curriculum:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit
      - run: npx --no-install playwright install --with-deps chromium webkit
      - run: npm run test:e2e

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit
      - run: npx --no-install playwright install --with-deps chromium webkit
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          pull: true
          push: false
          load: true
          tags: mathe-reise:ci
      - name: Scan runtime image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: mathe-reise:ci
          version: v0.76.1
          scanners: vuln
          severity: MEDIUM,HIGH,CRITICAL
          exit-code: '1'
      - name: Validate Compose configuration
        run: docker compose -f deploy/compose.yaml config
      - name: Start hardened container
        run: >-
          docker run --rm -d --name mathe-reise-ci
          --read-only
          --tmpfs /tmp:rw,noexec,nosuid,size=16m
          --cap-drop ALL
          --security-opt no-new-privileges:true
          -p 127.0.0.1:8080:8080
          mathe-reise:ci
      - name: Verify container and HTTP contract
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..20}; do
            if [ "$(docker inspect --format='{{.State.Health.Status}}' mathe-reise-ci)" = "healthy" ]; then
              break
            fi
            printf 'Waiting for healthcheck (%s/20)\n' "$attempt"
            sleep 1
          done
          test "$(docker inspect --format='{{.State.Health.Status}}' mathe-reise-ci)" = "healthy"
          test "$(docker inspect --format='{{.HostConfig.ReadonlyRootfs}}' mathe-reise-ci)" = "true"
          curl --fail --silent --show-error http://127.0.0.1:8080/ > /dev/null
          curl --fail --silent --show-error http://127.0.0.1:8080/manifest.webmanifest > /dev/null
          curl --fail --silent --show-error http://127.0.0.1:8080/sw.js > /dev/null
          curl --fail --silent --show-error http://127.0.0.1:8080/content/task-catalog.json > /dev/null
          curl --fail --silent --show-error --head http://127.0.0.1:8080/ \
            | grep --ignore-case 'X-Content-Type-Options: nosniff'
          curl --fail --silent --show-error --head http://127.0.0.1:8080/content/task-catalog.json \
            | grep --ignore-case 'Cache-Control: no-cache, must-revalidate'
      - name: Browser and offline tests against hardened container
        run: npm run test:e2e:container
      - name: Show container logs on failure
        if: failure()
        continue-on-error: true
        run: docker logs mathe-reise-ci
      - name: Stop test container
        if: always()
        continue-on-error: true
        run: docker rm --force mathe-reise-ci
